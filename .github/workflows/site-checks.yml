name: Site checks
on:
  pull_request:
    branches: [v2]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
